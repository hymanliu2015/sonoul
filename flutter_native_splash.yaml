flutter_native_splash:
  # 必须保持一致的背景色，防止图标边缘在极端尺寸下露白
  color: "#072D26"

  # 使用上面这张图
  image: assets/images/icon_logo.png

  # 关键设置：iOS 使用 scaleAspectFill 以确保“铺满”感
#  ios_content_mode: scaleAspectFill

  # 安卓全屏设置
  android_gravity: fill
  fullscreen: true

  # 安卓 12+ 适配
  android_12:
    color: "#072D26"
    # 注意：安卓12强制将图标放在圆圈内，建议此处单独制作一个无底色的图标
    image: assets/images/icon_logo.png
    icon_background_color: "#072D26"